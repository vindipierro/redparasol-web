name: Sync official Roblox thumbnails

on:
  push:
    branches: [main]
    paths:
      - scripts/sync_roblox_artwork.py
      - scripts/verified-games.json
      - .github/workflows/sync-roblox-artwork.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download verified Roblox game thumbnails
        run: python3 scripts/sync_roblox_artwork.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify website build
        run: |
          npm install
          npm run build
      - name: Commit fetched artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/games/ src/data/game-thumbnails.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: sync official Roblox game thumbnails"
            git push
          else
            echo "Official thumbnails already up to date."
          fi
