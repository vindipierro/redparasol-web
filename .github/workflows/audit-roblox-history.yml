name: Audit public Roblox portfolio statistics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_roblox_history.py
      - .github/workflows/audit-roblox-history.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect current, historical, and group Roblox metadata
        run: python3 scripts/audit_roblox_history.py
      - name: Commit research snapshot for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/public-roblox-history.json
          if ! git diff --cached --quiet; then
            git commit -m "research: refresh historical Roblox portfolio audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
