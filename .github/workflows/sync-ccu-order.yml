name: Refresh silent CCU ordering

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_ccu_order.py
      - scripts/verified-games.json
      - .github/workflows/sync-ccu-order.yml

permissions:
  contents: write

concurrency:
  group: refresh-ccu-display-order
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Roblox CCU and calculate display order
        run: python3 scripts/sync_ccu_order.py
      - name: Commit order only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ccu-order.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh silent CCU ordering"
            git push
          else
            echo "No change in game order."
          fi
